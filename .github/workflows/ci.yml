name: Validar build

on:
  pull_request:
    branches: [main]
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Regenerar acervo
        run: npm run recursos
      - name: Validar repertórios verificados
        run: npm run validar:repertorios
      - name: Testes unitários
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build estático (GitHub Pages)
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Build com servidor (rotas /api)
        run: npm run build
